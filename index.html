<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ARCHITECT WAR MAP — 7 DAY TRANSFORMATION</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #0A0E13;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        /* Animated grid background */
        #grid-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.15;
        }

        /* Particle canvas */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Main container */
        #app {
            position: relative;
            z-index: 3;
            height: 100vh;
            display: flex;
        }

        /* Toggle switch */
        #view-toggle {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            border: 1px solid rgba(0, 209, 255, 0.3);
            overflow: hidden;
        }

        .toggle-btn {
            padding: 12px 30px;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toggle-btn.active {
            background: rgba(0, 209, 255, 0.2);
            color: #00D1FF;
            box-shadow: 0 0 20px rgba(0, 209, 255, 0.3);
        }

        /* Main content area */
        #main-content {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Central core */
        #core {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
        }

        #core-rings {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .core-ring {
            position: absolute;
            border: 2px solid;
            border-radius: 50%;
            animation: pulse-ring 3s ease-in-out infinite;
        }

        .core-ring:nth-child(1) {
            width: 100%;
            height: 100%;
            border-color: rgba(0, 209, 255, 0.6);
            animation-delay: 0s;
        }

        .core-ring:nth-child(2) {
            width: 120%;
            height: 120%;
            left: -10%;
            top: -10%;
            border-color: rgba(0, 255, 136, 0.4);
            animation-delay: 1s;
        }

        .core-ring:nth-child(3) {
            width: 140%;
            height: 140%;
            left: -20%;
            top: -20%;
            border-color: rgba(0, 209, 255, 0.2);
            animation-delay: 2s;
        }

        @keyframes pulse-ring {
            0%, 100% {
                transform: scale(1);
                opacity: 0.6;
            }
            50% {
                transform: scale(1.05);
                opacity: 1;
            }
        }

        #core-content {
            position: relative;
            z-index: 2;
            background: radial-gradient(circle, rgba(0, 209, 255, 0.1), transparent);
            padding: 40px;
            border-radius: 50%;
        }

        #core h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #00D1FF;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        #core .subtitle {
            font-size: 11px;
            color: #00FF88;
            letter-spacing: 1px;
            line-height: 1.4;
        }

        #progress-ring {
            position: absolute;
            width: 320px;
            height: 320px;
            top: -20px;
            left: -20px;
        }

        #progress-ring circle {
            fill: none;
            stroke-width: 3;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-bg {
            stroke: rgba(0, 209, 255, 0.1);
        }

        .progress-bar {
            stroke: #00D1FF;
            stroke-linecap: round;
            filter: drop-shadow(0 0 8px rgba(0, 209, 255, 0.6));
        }

        /* Day nodes */
        #day-nodes {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .day-node {
            position: absolute;
            width: 120px;
            height: 120px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .day-node-inner {
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 209, 255, 0.3);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .day-node:hover .day-node-inner {
            background: rgba(0, 209, 255, 0.1);
            border-color: #00D1FF;
            box-shadow: 0 0 30px rgba(0, 209, 255, 0.4);
            transform: scale(1.1);
        }
